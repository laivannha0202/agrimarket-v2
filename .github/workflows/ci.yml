name: CI

# Build/test only. This workflow deliberately has no deployment, no repository
# secrets and no production database credentials. The MySQL service below is an
# ephemeral container whose schema exists only for this job.
on:
  push:
    branches:
      - main
      - develop
      - "fix/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agrimarket_v2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      CI: "true"
      NODE_ENV: test
      # Committed test-only signing key. The test setup replaces any inherited
      # JWT_SECRET with this value, so CI can never exercise a real key.
      TEST_JWT_SECRET: ci-only-test-signing-key-4f8c2d1a9b7e6f3c5d0a
      # The e2e suites rewrite this disposable schema only. DATABASE_URL is
      # intentionally NOT set at job level: the suites refuse to run when
      # TEST_DATABASE_URL aliases DATABASE_URL.
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/agrimarket_v2_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Security guardrails
        run: npm run security:smoke

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Apply migrations to disposable test database
        working-directory: apps/api
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/agrimarket_v2_test
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: End-to-end tests
        run: npm run test:e2e
